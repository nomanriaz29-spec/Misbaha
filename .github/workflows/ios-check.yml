name: iOS widget and watch check

# Compiles the Swift code with Apple's real toolchain and tests the widget on an
# iOS simulator: timeline logic plus a PNG of every widget size (see the artifact).
on:
  push:
    paths:
      - 'targets/**'
      - 'ci/**'
      - '.github/workflows/ios-check.yml'
  workflow_dispatch:

permissions:
  contents: write   # lets the job save widget snapshots to the ci-widget-snapshots branch

jobs:
  widget:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Typecheck widget (iOS 17+)
        run: |
          xcrun --sdk iphonesimulator swiftc -typecheck \
            -target arm64-apple-ios17.0-simulator \
            targets/prayer-widget/*.swift

      - name: Typecheck Apple Watch app
        run: |
          xcrun --sdk watchsimulator swiftc -typecheck \
            -target arm64-apple-watchos10.0-simulator \
            targets/watch/*.swift

      - name: Build widget test harness
        run: |
          mkdir -p build out
          xcrun --sdk iphonesimulator swiftc -parse-as-library \
            -target arm64-apple-ios17.0-simulator \
            targets/prayer-widget/PrayerTimesWidget.swift targets/prayer-widget/VerseWidget.swift targets/prayer-widget/SalahWidget.swift ci/VerseFixtures.swift ci/WidgetSnapshot.swift \
            -o build/widget-snapshot

      - name: Run widget tests on a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          print(next(x['udid'] for k, v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          SIMCTL_CHILD_TZ=Asia/Dubai xcrun simctl spawn "$UDID" "$PWD/build/widget-snapshot" "$PWD/out" | tee out/results.txt
          exit ${PIPESTATUS[0]}

      - name: Apple Watch screenshots
        if: always()
        run: |
          set -e
          APP=build/RatbWatchShots.app
          mkdir -p "$APP" out/watch
          FILES=$(ls targets/watch/*.swift | grep -v RatbWatchApp.swift)
          xcrun --sdk watchsimulator swiftc -parse-as-library \
            -target arm64-apple-watchos10.0-simulator \
            $FILES ci/WatchShots.swift -o "$APP/RatbWatchShots"
          cat > "$APP/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleIdentifier</key><string>com.nomanriaz.misbaha.watchshots</string>
            <key>CFBundleExecutable</key><string>RatbWatchShots</string>
            <key>CFBundleName</key><string>Ratb</string>
            <key>CFBundleDisplayName</key><string>Ratb</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>MinimumOSVersion</key><string>10.0</string>
            <key>CFBundleSupportedPlatforms</key><array><string>WatchSimulator</string></array>
            <key>UIDeviceFamily</key><array><integer>4</integer></array>
            <key>WKApplication</key><true/>
            <key>WKWatchOnly</key><true/>
          </dict></plist>
          PLIST
          codesign -s - --force "$APP"
          # Largest watch simulator available (Ultra first): its screenshots are an App Store size.
          WUDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          d = json.load(sys.stdin)['devices']
          w = [x for k, v in d.items() if 'watchOS' in k for x in v]
          w.sort(key=lambda x: (('Ultra' not in x['name']), ('mm' not in x['name']), x['name']), reverse=False)
          print(w[0]['udid'], file=sys.stdout); print('Watch simulator:', w[0]['name'], file=sys.stderr)")
          xcrun simctl boot "$WUDID" || true
          xcrun simctl bootstatus "$WUDID" -b
          xcrun simctl status_bar "$WUDID" override --time "9:41" || true
          xcrun simctl install "$WUDID" "$APP"
          for SHOT in list counter routine; do
            SIMCTL_CHILD_SHOT=$SHOT xcrun simctl launch "$WUDID" com.nomanriaz.misbaha.watchshots
            sleep 6
            xcrun simctl io "$WUDID" screenshot "out/watch/$SHOT.png"
            xcrun simctl terminate "$WUDID" com.nomanriaz.misbaha.watchshots || true
            sleep 1
          done
          sips -g pixelWidth -g pixelHeight out/watch/*.png

      - name: Save snapshots to the ci-widget-snapshots branch
        if: always()
        run: |
          cd out
          git init -q -b ci-widget-snapshots
          git config user.name "widget-check"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Widget snapshots for ${GITHUB_SHA::7}" || exit 0
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-widget-snapshots

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-check
          path: out/
